{% extends "registration/base.html" %}
{% block title %}Password Reset Complete · SimpleTix{% endblock %}

{% block content %}
<div class="card shadow-sm p-4">
  <h1 class="mb-3">Password changed</h1>

  <p class="mb-3">
    Your password has been set. You can now log in with your new credentials.
  </p>

  <a class="btn btn-primary" href="{% url 'accounts:login' %}">
    Log in
  </a>
</div>
{% endblock %}
